    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Pencarian Barang Multi-Toko</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background-color: #f4f6f9;
      }
      .container {
        max-width: 1000px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .filter-group {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }
      select,
      input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }
      select {
        width: 35%;
        cursor: pointer;
      }
      input {
        width: 65%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
        vertical-align: middle;
      }
      th {
        background-color: #1f4e78;
        color: white;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        color: white;
      }
      .lotte {
        background-color: #e63946;
      }
      .dali {
        background-color: #2a9d8f;
      }
      .bahagia {
        background-color: #e76f51;
      }
      .brand-text {
        font-weight: bold;
        color: #333;
      }
      /* Styling untuk Gambar Produk */
      .product-img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 5px;
        border: 1px solid #eee;
        display: block;
        margin: auto;
      }
      .no-img {
        font-size: 11px;
        color: #999;
        text-align: center;
      }
    </style>
  </head>

          <option value="Toko Bahagia">Toko Bahagia</option>

        <input
          type="text"
          id="searchInput"
          onkeyup="filterData()"

            <th>Harga Jual</th>

      </table>
    </div>

      function formatRupiah(number) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0,
        }).format(number);
      }

      function renderTable(data) {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">Data tidak ditemukan</td></tr>`;
          return;
        }

        data.forEach((item) => {
          let badgeClass = "dali";
          if (item.store === "Lotte Mart") badgeClass = "lotte";
          if (item.store === "Toko Bahagia") badgeClass = "bahagia";

          const imgCell = item.image
            ? `<img src="${item.image}" alt="${item.name}" class="product-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/60?text=No+Img';">`
            : `<span class="no-img">Tidak ada gambar</span>`;

          const row = `
        <tr>
          <td style="text-align:center;">${imgCell}</td>
          <td><span class="badge ${badgeClass}">${item.store}</span></td>
          <td class="brand-text">${item.brand}</td>
          <td>${item.name}</td>
          <td>${item.qty || "-"}</td>
          <td>${formatRupiah(item.price)}</td>
        </tr>
      `;
          tbody.innerHTML += row;
        });
      }

      function filterData() {
        const storeValue = document.getElementById("storeFilter").value;
        const searchValue = document
          .getElementById("searchInput")
          .value.toLowerCase();

        const filtered = items.filter((item) => {
          const matchStore = storeValue === "ALL" || item.store === storeValue;
          const matchName = item.name.toLowerCase().includes(searchValue);
          const matchBrand = item.brand.toLowerCase().includes(searchValue);
          return matchStore && (matchName || matchBrand);
        });

        renderTable(filtered);
      }
